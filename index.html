<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>扑街八字</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon/favicon.png">
  <link rel="icon" href="favicon/Favico.ico">
  <link rel="shortcut icon" href="favicon/Favico.ico">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="stylesheet" href="style.css?v=26" />
</head>

<body>

  <div class="top-bar">
    <div class="datetime-container">
      <div class="dropdowns-container">
        <div class="radio-containers-row">
          <div class="gender-radio-container">
            <label class="gender-radio-label">
              <input type="radio" name="gender" value="male" id="genderMale" checked>
              <span>男</span>
            </label>
            <label class="gender-radio-label">
              <input type="radio" name="gender" value="female" id="genderFemale">
              <span>女</span>
            </label>
          </div>
          <div class="calendar-radio-container">
            <label class="gender-radio-label">
              <input type="radio" name="calendar" value="solar" id="calendarSolar" checked>
              <span>阳历</span>
            </label>
            <label class="gender-radio-label">
              <input type="radio" name="calendar" value="lunar" id="calendarLunar">
              <span>阴历</span>
            </label>
          </div>
          <input type="text" id="quickDateInput" class="quick-date-input" placeholder="YYMMDD" maxlength="6"
            pattern="\d{6}">
        </div>
        <div class="date-selects-row">
          <select id="yearSelect" class="datetime-select"></select>
          <select id="monthSelect" class="datetime-select"></select>
          <select id="dateSelect" class="datetime-select"></select>
          <button id="resetBtn">🔄</button>
        </div>
        <div class="time-button-row">
          <select id="hourSelect" class="datetime-select"></select>
          <select id="timezoneSelect" class="datetime-select">
            <option value="-12">UTC-12</option>
            <option value="-11">UTC-11</option>
            <option value="-10">UTC-10</option>
            <option value="-9">UTC-9</option>
            <option value="-8">UTC-8</option>
            <option value="-7">UTC-7</option>
            <option value="-6">UTC-6</option>
            <option value="-5">UTC-5</option>
            <option value="-4">UTC-4</option>
            <option value="-3">UTC-3</option>
            <option value="-2">UTC-2</option>
            <option value="-1">UTC-1</option>
            <option value="0">UTC±0</option>
            <option value="1">UTC+1</option>
            <option value="2">UTC+2</option>
            <option value="3">UTC+3</option>
            <option value="4">UTC+4</option>
            <option value="5">UTC+5</option>
            <option value="6">UTC+6</option>
            <option value="7">UTC+7</option>
            <option value="8" selected>UTC+8</option>
            <option value="9">UTC+9</option>
            <option value="10">UTC+10</option>
            <option value="11">UTC+11</option>
            <option value="12">UTC+12</option>
            <option value="13">UTC+13</option>
            <option value="14">UTC+14</option>
          </select>
          <button id="copyBtn">📋</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content-container">
    <div class="content content-bazi">
      <h2 class="content-title">八字排盘</h2>
      <table class="bazi-table">
        <colgroup>
          <col>
          <col>
          <col>
          <col>
          <col>
        </colgroup>
        <thead>
          <tr>
            <th class="corner-cell"></th>
            <th>年柱</th>
            <th>月柱</th>
            <th>日柱</th>
            <th>时柱</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>主星</th>
            <td class="bazi-cell" id="year-main-star"></td>
            <td class="bazi-cell" id="month-main-star"></td>
            <td class="bazi-cell" id="day-main-star"></td>
            <td class="bazi-cell" id="hour-main-star"></td>
          </tr>
          <tr>
            <th>天干</th>
            <td class="bazi-cell" id="year-stem"></td>
            <td class="bazi-cell" id="month-stem"></td>
            <td class="bazi-cell" id="day-stem"></td>
            <td class="bazi-cell" id="hour-stem"></td>
          </tr>
          <tr>
            <th>地支</th>
            <td class="bazi-cell" id="year-branch"></td>
            <td class="bazi-cell" id="month-branch"></td>
            <td class="bazi-cell" id="day-branch"></td>
            <td class="bazi-cell" id="hour-branch"></td>
          </tr>
          <tr>
            <th>副星</th>
            <td class="bazi-cell" id="year-auxiliary"></td>
            <td class="bazi-cell" id="month-auxiliary"></td>
            <td class="bazi-cell" id="day-auxiliary"></td>
            <td class="bazi-cell" id="hour-auxiliary"></td>
          </tr>
          <tr>
            <th>神煞</th>
            <td class="bazi-cell" id="year-shensha"></td>
            <td class="bazi-cell" id="month-shensha"></td>
            <td class="bazi-cell" id="day-shensha"></td>
            <td class="bazi-cell" id="hour-shensha"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="content content-dayun">
      <h2 class="content-title">大运走势</h2>
      <div style="padding: 0 25px;">
        <div class="dayun-header" style="border: 1px solid var(--border-color); border-bottom: none; border-radius: 4px 4px 0 0;">
          <div class="dayun-header-grid-wrapper">
            <div class="dayun-header-line">起运：<span id="dayun-start-luck"></span></div>
            <div class="dayun-header-line">交运：<span id="dayun-transition-date"></span></div>
          </div>
        </div>
      </div>
      <div style="position: relative; padding: 0 25px;">
        <button id="dayun-prev-btn" class="dayun-nav-btn dayun-prev-btn">◀</button>
        <table class="dayun-table">
        <tbody>
          <tr>
            <td class="dayun-cell" id="dayun-0-shishen-top"></td>
            <td class="dayun-cell" id="dayun-1-shishen-top"></td>
            <td class="dayun-cell" id="dayun-2-shishen-top"></td>
            <td class="dayun-cell" id="dayun-3-shishen-top"></td>
            <td class="dayun-cell" id="dayun-4-shishen-top"></td>
            <td class="dayun-cell" id="dayun-5-shishen-top"></td>
          </tr>
          <tr>
            <td class="dayun-cell" id="dayun-0-ganzhi"></td>
            <td class="dayun-cell" id="dayun-1-ganzhi"></td>
            <td class="dayun-cell" id="dayun-2-ganzhi"></td>
            <td class="dayun-cell" id="dayun-3-ganzhi"></td>
            <td class="dayun-cell" id="dayun-4-ganzhi"></td>
            <td class="dayun-cell" id="dayun-5-ganzhi"></td>
          </tr>
          <tr>
            <td class="dayun-cell" id="dayun-0-shishen-bottom"></td>
            <td class="dayun-cell" id="dayun-1-shishen-bottom"></td>
            <td class="dayun-cell" id="dayun-2-shishen-bottom"></td>
            <td class="dayun-cell" id="dayun-3-shishen-bottom"></td>
            <td class="dayun-cell" id="dayun-4-shishen-bottom"></td>
            <td class="dayun-cell" id="dayun-5-shishen-bottom"></td>
          </tr>
          <tr>
            <td class="dayun-cell" id="dayun-0-age"></td>
            <td class="dayun-cell" id="dayun-1-age"></td>
            <td class="dayun-cell" id="dayun-2-age"></td>
            <td class="dayun-cell" id="dayun-3-age"></td>
            <td class="dayun-cell" id="dayun-4-age"></td>
            <td class="dayun-cell" id="dayun-5-age"></td>
          </tr>
          <tr>
            <td class="dayun-cell" id="dayun-0-year"></td>
            <td class="dayun-cell" id="dayun-1-year"></td>
            <td class="dayun-cell" id="dayun-2-year"></td>
            <td class="dayun-cell" id="dayun-3-year"></td>
            <td class="dayun-cell" id="dayun-4-year"></td>
            <td class="dayun-cell" id="dayun-5-year"></td>
          </tr>
        </tbody>
      </table>
      <button id="dayun-next-btn" class="dayun-nav-btn dayun-next-btn">▶</button>
      </div>
    </div>
  </div>


  <div id="bottom-actions">
    <button id="historyBtn" class="bottom-btn">📜 History</button>
    <button id="saveBtn" class="bottom-btn">💾 Save</button>
  </div>

  <div id="historyModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Saved History</h3>
        <button id="closeHistoryBtn" class="close-btn">&times;</button>
      </div>
      <div class="history-controls">
        <div class="filter-group">
          <label>Gender:</label>
          <select id="genderFilter" class="history-select">
            <option value="all">All</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="sort-group">
          <label>Sort:</label>
          <select id="historySort" class="history-select">
            <option value="oldest">Oldest</option>
            <option value="newest">Newest</option>
            <option value="nameAZ">Name A-Z</option>
          </select>
        </div>
      </div>
      <div id="historyList" class="history-list">
        <!-- History items will be injected here -->
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
  <script src="scripts/constants.js"></script>
  <script src="scripts/color.js"></script>
  <script src="scripts/shensha.js"></script>
  <script src="scripts/bazi.js"></script>
  <script src="scripts/dayun.js"></script>
  <script src="scripts/calendar.js"></script>
  <script src="scripts/clipboard.js"></script>
  <script src="scripts/history.js"></script>
  <script src="scripts/main.js"></script>
</body>

</html>
